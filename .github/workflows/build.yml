name: Build QuartzCraft

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Java 25 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Plugin bauen
        run: gradle build

      - name: JAR bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: QuartzCraft
          path: build/libs/*.jar
